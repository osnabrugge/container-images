---
name: Build
on:
  push:
    branches: ["main"]
    paths:
      - apps/**
      - .github/workflows/build.yaml
  workflow_dispatch:
    inputs:
      app:
        description: "Single app to build (leave blank to build all)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect
        id: detect
        env:
          INPUT_APP: ${{ inputs.app }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_APP}" ]]; then
            apps="${INPUT_APP}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            apps="$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            apps="$(git diff --name-only HEAD~1 HEAD -- apps/ | cut -d/ -f2 | sort -u)"
          else
            # First commit on the branch has no parent to diff against.
            apps="$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)"
          fi
          apps="$(echo "${apps}" | sed '/^$/d')"
          matrix="$(echo "${apps}" | jq -R . | jq -sc .)"
          count="$(echo "${apps}" | sed '/^$/d' | wc -l)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "Building: ${apps:-<none>}"

  build:
    name: ${{ matrix.app }}
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read metadata
        id: meta
        run: |
          set -euo pipefail
          version="$(jq -r '.version' "apps/${{ matrix.app }}/metadata.json")"
          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "::error::apps/${{ matrix.app }}/metadata.json has no .version"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          tags: |
            ghcr.io/osnabrugge/${{ matrix.app }}:${{ steps.meta.outputs.version }}
            ghcr.io/osnabrugge/${{ matrix.app }}:latest
