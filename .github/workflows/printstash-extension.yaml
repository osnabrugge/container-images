---
name: PrintStash extension
# Version-matched archives for manual browser installs, with explicit downstream
# revisions when a deployed upstream version needs a capture fix.
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - .github/workflows/printstash-extension.yaml
      - .github/patches/printstash-upload-timeout.patch
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag to build (default: the tag deployed by home-ops)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deployed version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      patched: ${{ steps.version.outputs.patched }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Read the PrintStash tag from home-ops
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          HELMRELEASE_URL: https://raw.githubusercontent.com/osnabrugge/home-ops/main/kubernetes/apps/printing/printstash/app/helmrelease.yaml
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            version="$(curl -fsSL "${HELMRELEASE_URL}" | yq '.spec.values.controllers.printstash.containers.api.image.tag')"
          fi
          version="${version%%@*}"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected PrintStash version '${version}'"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          release="printstash-extension-${version}"
          patched=false
          if [[ "${version}" == "v0.15.1" ]]; then
            release="${release}-homeops.1"
            patched=true
          fi
          echo "release=${release}" >> "${GITHUB_OUTPUT}"
          echo "patched=${patched}" >> "${GITHUB_OUTPUT}"
          if result="$(gh api "repos/${REPO}/releases/tags/${release}" 2>&1)"; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "${release} already published"
          elif [[ "${result}" == *"(HTTP 404)"* ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "${result}" >&2
            exit 1
          fi

  build:
    name: Build ${{ needs.resolve.outputs.version }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: src/browser-extension
    steps:
      - name: Checkout PrintStash
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xiao-villamor/PrintStash
          ref: ${{ needs.resolve.outputs.version }}
          path: src
          persist-credentials: false

      - name: Checkout downstream packaging
        if: needs.resolve.outputs.patched == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: packaging
          persist-credentials: false
          sparse-checkout: .github/patches

      - name: Apply the version-specific capture fix
        if: needs.resolve.outputs.patched == 'true'
        run: git -C .. apply "${GITHUB_WORKSPACE}/packaging/.github/patches/printstash-upload-timeout.patch"

      - name: Include the upstream redistribution license
        run: |
          mkdir -p public
          cp ../LICENSE public/LICENSE

      # Same toolchain as upstream's "Browser extension" CI job.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install
        run: pnpm install --frozen-lockfile --allow-build='!edgedriver' --allow-build='!geckodriver' --allow-build='!esbuild'

      - name: Typecheck
        run: pnpm typecheck

      - name: Package Chrome, Edge and Firefox
        run: pnpm zip:chrome && pnpm zip:edge && pnpm zip:firefox

      - name: Verify capture and packaged manifest contracts
        run: pnpm exec vitest run tests/popup.test.ts tests/capture-transport.test.ts tests/manifest.test.ts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE: ${{ needs.resolve.outputs.release }}
          PATCHED: ${{ needs.resolve.outputs.patched }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(.output/*.zip)
          if (( ${#zips[@]} == 0 )); then
            echo "::error::wxt produced no zip files"
            exit 1
          fi
          ls -la "${zips[@]}"
          cat > notes.md <<EOF
          Built from [xiao-villamor/PrintStash@${VERSION}](https://github.com/xiao-villamor/PrintStash/tree/${VERSION}/browser-extension), the version home-ops deploys.

          **Edge / Chrome:** extract the \`-edge\` or \`-chrome\` zip, open \`edge://extensions\` (or \`chrome://extensions\`), turn on Developer mode, choose **Load unpacked** and select the extracted folder. To upgrade, replace the folder contents and click **Reload**.

          **Firefox:** release Firefox only accepts signed add-ons, so load the \`-firefox\` zip temporarily from \`about:debugging\`.
          EOF
          if [[ "${PATCHED}" == "true" ]]; then
            cat >> notes.md <<'EOF'

          **HomeOps capture fix 1 (AI-assisted):** extension package 0.14.1 keeps
          metadata deadlines at 10 seconds, but allows up to five minutes per file
          upload. Cancellation, pairing and cleanup protections remain enabled.
          This is a downstream build of server tag v0.15.1, not a new upstream
          server release. The source archive includes the modified extension;
          the complete patch and regression tests are in this repository.
          EOF
          fi
          gh release create "${RELEASE}" "${zips[@]}" \
            --repo "${REPO}" \
            --title "PrintStash browser extension ${VERSION}" \
            --notes-file notes.md
