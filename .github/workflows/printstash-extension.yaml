---
name: PrintStash extension
# Upstream ships the browser extension only as a 30-day CI artifact, never as a
# release asset. Build it at the exact tag Flux deploys from home-ops so the
# extension and the server stay on the same version.
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - .github/workflows/printstash-extension.yaml
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag to build (default: the tag deployed by home-ops)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deployed version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Read the PrintStash tag from home-ops
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          HELMRELEASE_URL: https://raw.githubusercontent.com/osnabrugge/home-ops/main/kubernetes/apps/printing/printstash/app/helmrelease.yaml
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            version="$(curl -fsSL "${HELMRELEASE_URL}" | yq '.spec.values.controllers.printstash.containers.api.image.tag')"
          fi
          version="${version%%@*}"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected PrintStash version '${version}'"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if gh release view "printstash-extension-${version}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "printstash-extension-${version} already published"
          else
            echo "build=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build ${{ needs.resolve.outputs.version }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: src/browser-extension
    steps:
      - name: Checkout PrintStash
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xiao-villamor/PrintStash
          ref: ${{ needs.resolve.outputs.version }}
          path: src
          persist-credentials: false

      # Same toolchain as upstream's "Browser extension" CI job.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Package Chrome, Edge and Firefox
        run: pnpm zip:chrome && pnpm zip:edge && pnpm zip:firefox

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(.output/*.zip)
          if (( ${#zips[@]} == 0 )); then
            echo "::error::wxt produced no zip files"
            exit 1
          fi
          ls -la "${zips[@]}"
          cat > notes.md <<EOF
          Built from [xiao-villamor/PrintStash@${VERSION}](https://github.com/xiao-villamor/PrintStash/tree/${VERSION}/browser-extension), the version home-ops deploys.

          **Edge / Chrome:** extract the \`-edge\` or \`-chrome\` zip, open \`edge://extensions\` (or \`chrome://extensions\`), turn on Developer mode, choose **Load unpacked** and select the extracted folder. To upgrade, replace the folder contents and click **Reload**.

          **Firefox:** release Firefox only accepts signed add-ons, so load the \`-firefox\` zip temporarily from \`about:debugging\`.
          EOF
          gh release create "printstash-extension-${VERSION}" "${zips[@]}" \
            --repo "${REPO}" \
            --title "PrintStash browser extension ${VERSION}" \
            --notes-file notes.md
