---
name: SMFC fresh-temperature fallback
on:
  push:
    branches: [main]
    paths: [.github/workflows/smfc.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: smfc-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the reusable image definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: osnabrugge/containers
          ref: 6cb802524adf1a30c8e48c8ef1421a148fd38f41
          persist-credentials: false

      - name: Set up the pinned Go toolchain
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: --locked go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/smfc
          load: true
          tags: smfc:test
          cache-from: type=gha,scope=smfc
          cache-to: type=gha,scope=smfc,mode=max

      - name: Verify native sensor fallback behavior
        env:
          TEST_IMAGE: smfc:test
        run: |
          go test ./apps/smfc -run Test -count=1
          go vet ./apps/smfc

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/smfc
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=smfc
          tags: ghcr.io/osnabrugge/smfc:6.5.0-homeops.1
          labels: |
            org.opencontainers.image.source=https://github.com/osnabrugge/container-images
            org.opencontainers.image.url=https://github.com/osnabrugge/containers/tree/6cb802524adf1a30c8e48c8ef1421a148fd38f41/apps/smfc
            org.opencontainers.image.version=6.5.0-homeops.1
